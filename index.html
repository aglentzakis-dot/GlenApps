<style>
:root{
  --kitrino:#FDD117;--kitrino2:#EF9F02;--ble:#17324D;--ble2:#2B4C6E;
  --portok:#FFA628;--portok2:#EC4E0E;
  --fonto:#FFF9E6;--karta:#FFFFFF;--grammi:#EADFB8;--apalo:#5B6B7B;--prasino:#1E8A4C;
  --bar:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--fonto);color:var(--ble);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;font-size:16px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.krypto{display:none!important}

/* Οθόνη έναρξης */
#enarxi{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(circle at 50% 35%,var(--kitrino) 0%,var(--kitrino) 45%,var(--kitrino2) 120%);transition:opacity .45s}
#enarxi img{width:46vmin;max-width:240px;filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px rgba(255,255,255,.9))}
#enarxi b{font-size:30px;letter-spacing:.5px;color:var(--ble)}
#enarxi span{font-size:15px;color:var(--ble2)}
#enarxi.svinei{opacity:0;pointer-events:none}

/* Κεφαλίδα */
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--kitrino),#FCC611);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(23,50,77,.12)}
.pineza{width:44px;height:52px;flex:none}
header h1{margin:0;font-size:24px;line-height:1.1}
header small{display:block;font-size:13px;color:var(--ble2);font-weight:500}
header .ekdosi{margin-left:auto;white-space:nowrap;font-size:12px;background:rgba(255,255,255,.6);padding:5px 9px;border-radius:999px;font-weight:600}

main{max-width:760px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom))}

/* Κάρτα εγκατάστασης */
.egkatastasi{background:var(--ble);color:#fff;border-radius:22px;padding:18px;display:flex;gap:14px;align-items:center;margin-bottom:16px;
  box-shadow:0 6px 18px rgba(23,50,77,.25)}
.egkatastasi img{width:64px;height:64px;border-radius:16px;flex:none}
.egkatastasi h2{margin:0 0 4px;font-size:19px}
.egkatastasi p{margin:0;font-size:14px;opacity:.9}
.egkatastasi .koumpia{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.k-kitrino{background:var(--kitrino);color:var(--ble);font-weight:700;padding:11px 18px;border-radius:12px}
.k-diafano{color:#fff;opacity:.8;padding:11px 10px;white-space:nowrap}

/* Κάρτα κλειδιού */
.kleidi{background:var(--karta);border:2px solid var(--grammi);border-radius:22px;padding:16px;margin-bottom:18px}
.kleidi.energo{border-color:var(--prasino);background:#F1FAF4}
.kleidi .pano{display:flex;align-items:center;gap:12px}
.kleidi .simadi{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--fonto);flex:none}
.kleidi.energo .simadi{background:var(--prasino)}
.kleidi h2{margin:0;font-size:18px}
.kleidi p{margin:2px 0 0;font-size:14px;color:var(--apalo)}
.kleidi .koumpi-ble{margin-top:12px;width:100%}
.koumpi-ble{background:var(--ble);color:#fff;font-weight:700;padding:13px 16px;border-radius:14px;font-size:16px}
.koumpi-ble:active{background:var(--ble2)}

h3.titlos{font-size:15px;text-transform:none;color:var(--apalo);margin:4px 4px 10px;font-weight:600}

/* Πλακίδια */
.plakidia{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plakidio{background:var(--karta);border-radius:22px;padding:16px 14px 14px;text-align:left;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 2px 0 var(--grammi),0 4px 14px rgba(23,50,77,.07);min-height:200px;position:relative;transition:transform .12s}
.plakidio:active{transform:scale(.97)}
.plakidio img,.plakidio .gramma{width:68px;height:68px;border-radius:18px;object-fit:cover;background:var(--fonto)}
.plakidio .gramma{display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;background:var(--kitrino)}
.plakidio b{font-size:18px;line-height:1.2}
.plakidio span{font-size:13.5px;color:var(--apalo);flex:1}
.etiketa{align-self:flex-start;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:#EEF1F4;color:var(--apalo)}
.etiketa.pro{background:var(--prasino);color:#fff}
@media(min-width:620px){.plakidia{grid-template-columns:1fr 1fr 1fr}}

footer{margin-top:26px;text-align:center;font-size:12px;color:var(--apalo)}
footer button{text-decoration:underline;color:var(--ble);font-size:13px;padding:6px}

/* Προβολή εφαρμογής */
#provoli{position:fixed;inset:0;z-index:20;background:#fff;display:flex;flex-direction:column}
#plaisia{flex:1;position:relative;padding-top:env(safe-area-inset-top);background:#fff}
#plaisia iframe{position:absolute;inset:0;top:env(safe-area-inset-top);width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:#fff}
#fortosi{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--fonto);color:var(--apalo);font-size:15px;z-index:2}
#fortosi img{width:84px;height:84px;border-radius:22px;animation:palmos 1s ease-in-out infinite}
@keyframes palmos{50%{transform:scale(.92);opacity:.75}}
#katobara{height:calc(var(--bar) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--ble);display:flex;align-items:stretch;flex:none;overflow:hidden;transition:height .25s ease,padding .25s ease}
#provoli.bara-krypti #katobara{height:0;padding-bottom:0}
#baraLabi{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--bar) + env(safe-area-inset-bottom));z-index:4;background:var(--ble);color:#fff;border:0;width:56px;height:20px;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:center;box-shadow:0 -2px 8px rgba(0,0,0,.18);transition:bottom .25s ease}
#provoli.bara-krypti #baraLabi{bottom:env(safe-area-inset-bottom)}
#baraLabi svg{transition:transform .25s ease}
#provoli.bara-krypti #baraLabi svg{transform:rotate(180deg)}
#katobara .spiti,#katobara .exo{width:58px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:10.5px;gap:2px}
#katobara .spiti{background:var(--kitrino);color:var(--ble);font-weight:700}
#katobara .lista{flex:1;display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;padding:0 4px}
#katobara .lista::-webkit-scrollbar{display:none}
#katobara .efarm{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8aa0b4;font-size:10.5px;border-top:3px solid transparent;opacity:.42;transition:opacity .15s,transform .12s;touch-action:pan-x;user-select:none}
#katobara .efarm img,#katobara .efarm .gramma{width:30px;height:30px;border-radius:8px;background:#fff;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ble);filter:grayscale(.35)}
#katobara .efarm.energi{border-top-color:var(--kitrino);color:#fff;opacity:1}
#katobara .efarm.energi img,#katobara .efarm.energi .gramma{filter:none}
#katobara .efarm.sernetai{opacity:.9;transform:scale(1.12);background:rgba(255,255,255,.08);border-radius:10px}
#katobara .efarm span{max-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Παράθυρα */
.skia{position:fixed;inset:0;z-index:50;background:rgba(23,50,77,.45);display:flex;align-items:flex-end;justify-content:center}
.fyllo{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.fyllo h2{margin:0 0 6px;font-size:21px}
.fyllo p{margin:6px 0;color:var(--apalo);font-size:14.5px}
.fyllo label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.fyllo input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:2px solid var(--grammi);border-radius:12px;color:var(--ble);background:#FFFDF6}
.fyllo input:focus{outline:none;border-color:var(--kitrino2)}
.timokatalogos{background:var(--fonto);border-radius:16px;padding:12px 14px;margin:12px 0}
.timokatalogos .grammi{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}
.timokatalogos .megali{font-size:17px;font-weight:800}
.timokatalogos hr{border:0;border-top:1px dashed var(--grammi);margin:8px 0}
.lathos{color:#B3261E!important;font-weight:600}
.oroi{font-size:13.5px;color:var(--ble);background:#F4F7FA;border-radius:14px;padding:10px 12px;margin:8px 0}
.oroi ul{margin:6px 0 0;padding-left:18px}.oroi li{margin:3px 0}
.kleidi .proeid{color:#9A5B00!important;font-weight:600}
.fyllo .seira{display:flex;gap:10px;margin-top:16px}
.fyllo .seira button{flex:1}
.k-aplo{background:#EEF1F4;color:var(--ble);font-weight:700;padding:13px 16px;border-radius:14px}

#minima{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:var(--ble);color:#fff;
  padding:12px 18px;border-radius:14px;font-size:14.5px;max-width:90vw;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;pointer-events:none}
#minima.fainetai{opacity:1}
#neaEkdosi{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:95;background:var(--ble);color:#fff;border-radius:16px;padding:12px 14px;
  display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:14.5px}
#neaEkdosi button{margin-left:auto}
</style>
</head>

      <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA628"/><stop offset="1" stop-color="#EC4E0E"/></linearGradient></defs>
      <path d="M22 51C22 51 3 31 3 19.5A19 19 0 0 1 41 19.5C41 31 22 51 22 51Z" fill="url(#pg)"/>

<div id="provoli" class="krypto">

  </div>

<script>
"use strict";
const APP_VERSION="0.6";
const APP_BUILD="10/10/2026";
const KLEIDI_KOINO="glenapps-kleidi";      // κοινό για όλες τις εφαρμογές
const LISTA_TOPIKA="glenapps-lista";
const EGKAT_OXI="glenapps-egkat-oxi";
// Ίδιο δημόσιο κλειδί με το Δρομολόγιο: τα κλειδιά τα υπογράφει μόνο η γεννήτρια του δημιουργού.
const LIC_PUB={kty:"EC",crv:"P-256",x:"vz6Lkoa7PzVQ1xGOcUyYmYPdOYYjbsp5t1xSsgc8cwg",y:"x9KzKNLFp5OKklXt6VcEaFlwr3wzvRjb1OJ9t1cBR1Q"};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const apothiki={
  pare(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch{return null}},
  vale(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
  svise(k){try{localStorage.removeItem(k)}catch{}}
};
let xronosMinimatos;
function minima(t){const m=$("#minima");m.textContent=t;m.classList.add("fainetai");clearTimeout(xronosMinimatos);xronosMinimatos=setTimeout(()=>m.classList.remove("fainetai"),2800)}

/* ---------- Λίστα εφαρμογών (από το κοινό αρχείο) ---------- */
const PROEPILOGI={paketo:{timi_etos:99,timi_2etia:169,athroisma_xorista:120},efarmoges:[]};
let DATA=apothiki.pare(LISTA_TOPIKA)||PROEPILOGI;
async function fortoseLista(){
  try{
    const r=await fetch("efarmoges.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw 0;
    const d=await r.json();
    if(d&&Array.isArray(d.efarmoges)){DATA=d;apothiki.vale(LISTA_TOPIKA,d)}
  }catch{}
  zografise();
}

/* ---------- Κλειδί GlenApps ---------- */
const B32="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function b32dec(t){let e=0,n=0;const o=[];for(const a of t){const i=B32.indexOf(a);if(i<0)return null;n=n<<5|i;e+=5;if(e>=8){e-=8;o.push(n>>e&255)}}return new Uint8Array(o)}
function analyseKleidi(t){
  const e=String(t||"").toUpperCase().replace(/[\s\-–—_.]+/g,"").replace(/O/g,"0").replace(/[IL]/g,"1");
  const m=/^GA2(\d{6})([0-9A-Z]{100,110})$/.exec(e); if(!m)return null;
  const sig=b32dec(m[2]); if(!sig||sig.length<64)return null;
  return {katharo:e,eos:"20"+m[1].slice(0,2)+"-"+m[1].slice(2,4)+"-"+m[1].slice(4,6),sig:sig.slice(0,64)};
}
const kanoniko=t=>String(t||"").trim().toLowerCase();
async function sima(t){const e=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(e)].map(n=>n.toString(16).padStart(2,"0")).join("")}
async function epalitheuse(email,kleidi){
  const k=analyseKleidi(kleidi); if(!k)return null;
  try{
    const eh=await sima(kanoniko(email));
    const pk=await crypto.subtle.importKey("jwk",LIC_PUB,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    const ok=await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},pk,k.sig,new TextEncoder().encode("GA|"+eh+"|"+k.eos));
    return ok?{email:kanoniko(email),eh,kleidi:k.katharo,eos:k.eos}:null;
  }catch{return null}
}
const meresMexri=eos=>Math.ceil((new Date(eos+"T23:59:59").getTime()-Date.now())/864e5);
const imerominia=eos=>{const [y,m,d]=eos.split("-");return `${+d}/${+m}/${y}`};
let KATASTASI={energo:false};
async function elegxeKleidi(){
  const s=apothiki.pare(KLEIDI_KOINO);
  if(s&&s.kleidi&&s.email){
    const v=await epalitheuse(s.email,s.kleidi);
    if(v&&meresMexri(v.eos)>0){KATASTASI={energo:true,...v,meres:meresMexri(v.eos)};return}
    if(v)KATASTASI={energo:false,elixe:true,eos:v.eos};else KATASTASI={energo:false};
    return;
  }
  KATASTASI={energo:false};
}

/* ---------- Αρχική ---------- */
function eikonidioHTML(a,klasi){
  const gr=esc((a.onoma||"?").trim().charAt(0));
  return `<img class="${klasi||""}" src="${esc(a.eikonidio)}" alt="" loading="lazy" onerror="eikonidioLathos(this,'${esc(a.dieuthinsi)}','${gr}')">`;
}
window.eikonidioLathos=(img,dieuth,gr)=>{
  // δοκιμάζει και τη δεύτερη συνηθισμένη θέση, αλλιώς γράμμα
  if(!img.dataset.dokimi){img.dataset.dokimi="1";const alt=dieuth.replace(/\/?$/,"/")+(img.src.includes("/eikonidia/")?"icon-192.png":"eikonidia/icon-192.png");img.src=alt;return}
  const d=document.createElement("div");d.className="gramma "+(img.className||"");d.textContent=gr;img.replaceWith(d);
};
function zografiseKleidi(){
  const k=$("#kartaKleidi"),p=DATA.paketo||PROEPILOGI.paketo;
  if(KATASTASI.energo){
    k.className="kleidi energo";
    k.innerHTML=`<div class="pano"><div class="simadi"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></div>
      <div><h2>Όλες οι εφαρμογές ξεκλειδωμένες</h2><p>GlenApps Full έως ${imerominia(KATASTASI.eos)} · ${KATASTASI.meres} ημέρες ακόμα</p>${KATASTASI.meres<=30?`<p class="proeid">Λήγει σύντομα — ανανέωσε για να συνεχίσει χωρίς διακοπή.</p>`:""}</div></div>
      <button class="k-aplo" style="margin-top:12px;width:100%" id="koumpiKleidi">Στοιχεία κλειδιού</button>`;
  }else{
    k.className="kleidi";
    const elixe=KATASTASI.elixe?`<p class="lathos">Το κλειδί σου έληξε στις ${imerominia(KATASTASI.eos)}.</p>`:"";
    k.innerHTML=`<div class="pano"><div class="simadi"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17324D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
      <div><h2>Ένα κλειδί για όλες</h2><p>Το GlenApps Full ξεκλειδώνει το Pro σε όλες τις εφαρμογές: ${p.timi_etos} € τον χρόνο αντί ${p.athroisma_xorista} €.</p></div></div>
      ${elixe}<button class="koumpi-ble" id="koumpiKleidi">Έχω κλειδί / Τιμές</button>`;
  }
  $("#koumpiKleidi").onclick=anoixeKleidi;
}
function zografise(){
  zografiseKleidi();
  const pro=KATASTASI.energo;
  $("#plakidia").innerHTML=(DATA.efarmoges||[]).map((a,i)=>`
    <button class="plakidio" data-i="${i}">
      ${eikonidioHTML(a)}
      <b>${esc(a.onoma)}</b>
      <span>${esc(a.perigrafi)}</span>
      <em class="etiketa ${pro?"pro":""}" style="font-style:normal">${pro?"✓ Pro ξεκλείδωτο":"Δωρεάν έκδοση"}</em>
    </button>`).join("")||`<p style="grid-column:1/-1;color:var(--apalo)">Η λίστα θα φορτωθεί μόλις υπάρξει σύνδεση στο διαδίκτυο.</p>`;
  document.querySelectorAll(".plakidio").forEach(b=>b.onclick=()=>anoixeEfarmogi(+b.dataset.i));
  xtiseBara();
  simeioseEnergi();
}

/* ---------- Κάτω μπάρα: σειρά με σύρσιμο ---------- */
const SEIRA_KEY="glenapps-seira-bara";
function taksinomimeni(){
  const saved=apothiki.pare(SEIRA_KEY)||[];
  return (DATA.efarmoges||[]).map((a,i)=>({a,i})).sort((x,y)=>{
    const px=saved.indexOf(x.a.id),py=saved.indexOf(y.a.id);
    if(px<0&&py<0)return 0; if(px<0)return 1; if(py<0)return -1; return px-py;
  });
}
function apothikeuseSeira(){
  const ids=[...document.querySelectorAll("#kateListat .efarm")].map(b=>b.dataset.id);
  apothiki.vale(SEIRA_KEY,ids);
}
let molisSyrthike=false;
function xtiseBara(){
  const l=$("#kateListat");
  l.innerHTML=taksinomimeni().map(({a,i})=>`<button class="efarm" data-i="${i}" data-id="${esc(a.id)}">${eikonidioHTML(a)}<span>${esc(a.onoma)}</span></button>`).join("");
  l.querySelectorAll(".efarm").forEach(b=>{
    b.onclick=()=>{if(molisSyrthike){molisSyrthike=false;return}anoixeEfarmogi(+b.dataset.i,true)};
    let holdT=null,sernei=false,kinithike=false,sx=0,sy=0;
    function kineited(e){
      const x=(e.touches?e.touches[0]:e).clientX, y=(e.touches?e.touches[0]:e).clientY;
      if(!sernei){ if(Math.abs(x-sx)>9||Math.abs(y-sy)>9)clearTimeout(holdT); return; }
      if(e.cancelable)e.preventDefault(); kinithike=true;
      const alla=[...l.querySelectorAll(".efarm:not(.sernetai)")];
      const meta=alla.find(o=>{const r=o.getBoundingClientRect();return x<r.left+r.width/2});
      if(meta)l.insertBefore(b,meta);else l.appendChild(b);
    }
    function piase(){sernei=true;b.classList.add("sernetai");l.style.touchAction="none";try{navigator.vibrate&&navigator.vibrate(15)}catch{}}
    function telos(){
      clearTimeout(holdT);l.style.touchAction="";
      document.removeEventListener("pointermove",kineited);document.removeEventListener("pointerup",telos);document.removeEventListener("pointercancel",telos);
      document.removeEventListener("touchmove",kineited);document.removeEventListener("touchend",telos);
      if(sernei){sernei=false;b.classList.remove("sernetai");if(kinithike){apothikeuseSeira();molisSyrthike=true}}
    }
    function arxi(e){
      const p=e.touches?e.touches[0]:e; sx=p.clientX;sy=p.clientY;kinithike=false;sernei=false;
      clearTimeout(holdT);holdT=setTimeout(piase,320);
      document.addEventListener("pointermove",kineited,{passive:false});document.addEventListener("pointerup",telos);document.addEventListener("pointercancel",telos);
      document.addEventListener("touchmove",kineited,{passive:false});document.addEventListener("touchend",telos);
    }
    b.addEventListener("pointerdown",arxi);
  });
}

/* ---------- Κάτω μπάρα: εμφάνιση/απόκρυψη ---------- */
const BARA_KRYPTI_KEY="glenapps-bara-krypti";
function efarmoseBaraKatastasi(){
  const krypti=apothiki.pare(BARA_KRYPTI_KEY)===true;
  $("#provoli").classList.toggle("bara-krypti",krypti);
}
$("#baraLabi").onclick=()=>{
  const nea=!$("#provoli").classList.contains("bara-krypti");
  $("#provoli").classList.toggle("bara-krypti",nea);
  apothiki.vale(BARA_KRYPTI_KEY,nea);
};

/* ---------- Άνοιγμα εφαρμογής μέσα στην πύλη ---------- */
const plaisia=new Map();      // id -> iframe (μένουν φορτωμένα για γρήγορη εναλλαγή)
const MEGISTO=3;
let trexousa=null;
function anoixeEfarmogi(i,apoBara){
  const a=(DATA.efarmoges||[])[i]; if(!a)return;
  if(!navigator.onLine&&!plaisia.has(a.id))minima("Χωρίς σύνδεση: θα ανοίξει μόνο αν την έχεις ανοίξει ξανά σε αυτό το κινητό.");
  $("#arxiki").setAttribute("aria-hidden","true");
  $("#provoli").classList.remove("krypto");
  if(!trexousa||!apoBara)history.pushState({efarmogi:a.id},"","#"+a.id);
  else history.replaceState({efarmogi:a.id},"","#"+a.id);
  trexousa=a;
  plaisia.forEach((f,id)=>f.style.visibility=id===a.id?"visible":"hidden");
  let f=plaisia.get(a.id);
  if(!f){
    $("#fortosiEik").src=a.eikonidio;$("#fortosiKeim").textContent="Ανοίγει το «"+a.onoma+"»…";$("#fortosi").classList.remove("krypto");
    f=document.createElement("iframe");
    f.title=a.onoma;
    f.allow="geolocation; camera; microphone; clipboard-read; clipboard-write; fullscreen; web-share; screen-wake-lock";
    f.src=a.dieuthinsi;
    f.onload=()=>{if(trexousa&&trexousa.id===a.id)$("#fortosi").classList.add("krypto")};
    $("#plaisia").appendChild(f);
    plaisia.set(a.id,f);
    // κρατάμε το πολύ 3 ανοιχτές, για να μη βαραίνει το κινητό
    if(plaisia.size>MEGISTO){const palia=[...plaisia.keys()].find(id=>id!==a.id);plaisia.get(palia).remove();plaisia.delete(palia)}
  }else $("#fortosi").classList.add("krypto");
  simeioseEnergi();
}
function simeioseEnergi(){
  document.querySelectorAll("#kateListat .efarm").forEach(b=>{
    const a=DATA.efarmoges[+b.dataset.i];const on=trexousa&&a&&a.id===trexousa.id;
    b.classList.toggle("energi",!!on);if(on)b.scrollIntoView({inline:"center",block:"nearest"});
  });
}
function piseStinArxiki(apoIstoriko){
  $("#provoli").classList.add("krypto");$("#arxiki").removeAttribute("aria-hidden");
  trexousa=null;
  if(!apoIstoriko&&history.state&&history.state.efarmogi)history.back();
  elegxeKleidi().then(zografise);   // μπορεί να άλλαξε το κλειδί μέσα σε κάποια εφαρμογή
}
$("#koumpiSpiti").onclick=()=>piseStinArxiki(false);
$("#koumpiExo").onclick=()=>{if(trexousa)window.open(trexousa.dieuthinsi,"_blank")};
window.addEventListener("popstate",e=>{
  const id=e.state&&e.state.efarmogi;
  if(id){const i=DATA.efarmoges.findIndex(a=>a.id===id);if(i>=0){anoixeEfarmogi(i,true);return}}
  if(trexousa)piseStinArxiki(true);
});

/* ---------- Παράθυρο κλειδιού ---------- */
function anoixeKleidi(){
  const p=DATA.paketo||PROEPILOGI.paketo;
  const xorista=(DATA.efarmoges||[]).map(a=>`<div class="grammi"><span>${esc(a.onoma)}</span><span>${esc(a.timi||"")}</span></div>`).join("");
  const s=document.createElement("div");s.className="skia";
  const energo=KATASTASI.energo;
  s.innerHTML=`<div class="fyllo" role="dialog" aria-modal="true">
    <h2>${energo?"Το κλειδί σου":"Κλειδί GlenApps"}</h2>
    ${energo?`<p>Ενεργό έως <b>${imerominia(KATASTASI.eos)}</b> για <b>${esc(KATASTASI.email)}</b>.</p><p>Ξεκλειδώνει το Pro σε όλες τις εφαρμογές της λίστας.</p>`
      :`<p>Ένα κλειδί ξεκλειδώνει το Pro σε όλες τις εφαρμογές GlenApps, και σε όσες προστεθούν.</p>`}
    <div class="timokatalogos">
      <div class="grammi megali"><span>GlenApps Full, 1 χρόνος</span><span>${p.timi_etos} €</span></div>
      <hr><div class="grammi" style="font-weight:700"><span>Χωριστά ανά εφαρμογή (τον χρόνο)</span><span></span></div>
      ${xorista}
      <hr><div class="grammi" style="font-weight:700"><span>Σύνολο χωριστά</span><span>${p.athroisma_xorista} €</span></div>
    </div>
    <div class="oroi">
      <b>Καθαρά πράγματα</b>
      <ul>
        <li>Το κλειδί ισχύει <b>1 χρόνο</b>, μέχρι την ημερομηνία που γράφει. Τη βλέπεις πάντα εδώ.</li>
        <li><b>Δεν ανανεώνεται αυτόματα</b> και δεν γίνεται καμία χρέωση χωρίς να το ζητήσεις.</li>
        <li>Θα σε ειδοποιήσουμε 30 ημέρες πριν λήξει. Αν ανανεώσεις νωρίτερα, ο νέος χρόνος <b>προστίθεται</b> στη λήξη σου· δεν χάνεις μέρες.</li>
        <li>Αν χάσεις το κλειδί, σου ξαναστέλνουμε δωρεάν, με την <b>ίδια</b> ημερομηνία λήξης.</li>
        <li>Όταν λήξει, <b>τα δεδομένα σου μένουν όλα</b>· κλειδώνουν μόνο οι λειτουργίες Pro.</li>
      </ul>
    </div>
    ${energo?"":`<label for="kEmail">Ηλεκτρονικό ταχυδρομείο αγοράς</label>
    <input id="kEmail" type="email" inputmode="email" autocomplete="email" placeholder="π.χ. onoma@gmail.com">
    <label for="kKleidi">Κλειδί</label>
    <input id="kKleidi" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="GA2-…">
    <p id="kLathos" class="lathos krypto"></p>`}
    <div class="seira">
      <button class="k-aplo" id="kKleise">Κλείσιμο</button>
      ${energo?`<button class="k-aplo" id="kAfairesi">Αφαίρεση κλειδιού</button>`:`<button class="koumpi-ble" id="kEnergo">Ενεργοποίηση</button>`}
    </div>
  </div>`;
  document.body.appendChild(s);
  const kleise=()=>s.remove();
  s.onclick=e=>{if(e.target===s)kleise()};
  s.querySelector("#kKleise").onclick=kleise;
  const af=s.querySelector("#kAfairesi");
  if(af)af.onclick=()=>{if(confirm("Να αφαιρεθεί το κλειδί GlenApps από αυτό το κινητό;")){apothiki.svise(KLEIDI_KOINO);kleise();elegxeKleidi().then(zografise);minima("Το κλειδί αφαιρέθηκε.")}};
  const en=s.querySelector("#kEnergo");
  if(en)en.onclick=async()=>{
    const email=s.querySelector("#kEmail").value,kl=s.querySelector("#kKleidi").value,l=s.querySelector("#kLathos");
    const lathos=t=>{l.textContent=t;l.classList.remove("krypto")};
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(kanoniko(email)))return lathos("Γράψε το ηλεκτρονικό ταχυδρομείο με το οποίο αγόρασες.");
    if(!analyseKleidi(kl))return lathos("Το κλειδί δεν μοιάζει με κλειδί GlenApps (ξεκινά με GA2).");
    en.disabled=true;en.textContent="Έλεγχος…";
    const v=await epalitheuse(email,kl);
    en.disabled=false;en.textContent="Ενεργοποίηση";
    if(!v)return lathos("Το κλειδί δεν ταιριάζει με αυτό το ηλεκτρονικό ταχυδρομείο.");
    if(meresMexri(v.eos)<=0)return lathos("Αυτό το κλειδί έχει λήξει.");
    apothiki.vale(KLEIDI_KOINO,{...v,energopoiithike:new Date().toISOString()});
    kleise();await elegxeKleidi();zografise();minima("Ξεκλειδώθηκαν όλες οι εφαρμογές!");
  };
}

/* ---------- Εγκατάσταση ---------- */
let protasiEgkat=null;
const egkatestimeni=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const iphone=/iphone|ipad|ipod/i.test(navigator.userAgent);
function kartaEgkat(){
  const k=$("#kartaEgkat");
  if(egkatestimeni()||apothiki.pare(EGKAT_OXI)>Date.now()){k.classList.add("krypto");return}
  k.classList.remove("krypto");
  if(iphone){$("#egkatKeimeno").textContent="Στο Safari πάτα το κουμπί Κοινοποίηση και μετά «Προσθήκη στην οθόνη Αφετηρίας».";$("#koumpiEgkat").textContent="Κατάλαβα"}
}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();protasiEgkat=e;kartaEgkat()});
window.addEventListener("appinstalled",()=>{protasiEgkat=null;$("#kartaEgkat").classList.add("krypto");minima("Το GlenApps μπήκε στην αρχική οθόνη!")});
$("#koumpiEgkat").onclick=async()=>{
  if(iphone){$("#kartaEgkat").classList.add("krypto");return}
  if(protasiEgkat){protasiEgkat.prompt();try{await protasiEgkat.userChoice}catch{}protasiEgkat=null;return}
  minima("Άνοιξε το μενού του περιηγητή (⋮) και πάτα «Εγκατάσταση εφαρμογής» ή «Προσθήκη στην αρχική οθόνη».");
};
$("#koumpiOxiTora").onclick=()=>{apothiki.vale(EGKAT_OXI,Date.now()+7*864e5);$("#kartaEgkat").classList.add("krypto")};

/* ---------- Έκδοση και αυτόματη αναβάθμιση ---------- */
$("#ekdosiEtiketa").textContent="έκδ. "+APP_VERSION;
$("#ekdosiKato").textContent="Έκδοση "+APP_VERSION+" · Ανέβηκε "+APP_BUILD;
async function anavathmise(){
  try{const r=await navigator.serviceWorker?.getRegistration();if(r)await r.update();const c=await caches.keys();await Promise.all(c.map(k=>caches.delete(k)))}catch{}
  setTimeout(()=>location.replace(location.origin+location.pathname+"?v="+Date.now()),300);
}
function bariaNeaEkdosi(v){
  if(!trexousa){anavathmise();return}         // στην αρχική: αναβαθμίζεται μόνη της
  if($("#neaEkdosi"))return;
  const d=document.createElement("div");d.id="neaEkdosi";
  d.innerHTML=`<span>Νέα έκδοση ${esc(v)} της πύλης</span><button class="k-kitrino">Αναβάθμιση</button>`;
  d.querySelector("button").onclick=anavathmise;document.body.appendChild(d);
}
let teleutaiosElegxos=0;
async function elegxosEkdosis(siopila){
  if(siopila){const t=Date.now();if(t-teleutaiosElegxos<6e4)return;teleutaiosElegxos=t}
  if(!siopila)minima("Έλεγχος για νεότερη έκδοση…");
  try{
    const html=await(await fetch(location.pathname+"?probe="+Date.now(),{cache:"no-store"})).text();
    const m=html.match(/<meta name="app-version" content="([^"]+)"/);
    if(m&&m[1]!==APP_VERSION){bariaNeaEkdosi(m[1]);return}
    if(!siopila)minima("Έχεις την τελευταία έκδοση ("+APP_VERSION+").");
  }catch{if(!siopila)minima("Ο έλεγχος χρειάζεται σύνδεση στο διαδίκτυο.")}
}
$("#koumpiElegxos").onclick=()=>elegxosEkdosis(false);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){elegxosEkdosis(true);if(!trexousa)elegxeKleidi().then(zografise)}});
window.addEventListener("focus",()=>elegxosEkdosis(true));

/* ---------- Έναρξη ---------- */
if("serviceWorker"in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
(async()=>{
  await elegxeKleidi();
  zografise();
  efarmoseBaraKatastasi();
  kartaEgkat();
  fortoseLista();
  setTimeout(()=>{$("#enarxi").classList.add("svinei");setTimeout(()=>$("#enarxi").remove(),500)},1100);
  // αν άνοιξε με #εφαρμογή (π.χ. μετά από ανανέωση), την ξανανοίγουμε
  const h=decodeURIComponent(location.hash.slice(1));
  if(h){history.replaceState(null,"",location.pathname);const i=(DATA.efarmoges||[]).findIndex(a=>a.id===h);if(i>=0)anoixeEfarmogi(i)}
  setTimeout(()=>elegxosEkdosis(true),4000);
})();
</script>
